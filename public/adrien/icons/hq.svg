<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    App icon = the Jarvis identity, and specifically THE asset the mobile app already
    ships: mobile/assets/images/icon.png (expo.name "Jarvis", io.khufu.jarvis). This is
    a vector trace of that PNG, not a redraw — every number below was measured off it
    (subpixel edge detection for the stars, per-radius ring fits for the halo), and
    `npm run icons:verify` re-renders this file and diffs it against the PNG so the two
    cannot silently drift. The product name stays "Khufu HQ" everywhere; only the mark.

    Full-bleed on purpose (no white rounded plate): that is what the PNG does, what
    manifest.webmanifest's `purpose: maskable` needs (transparent corners get
    letterboxed), and what iOS wants for apple-touch-icon (it masks the square itself
    and renders alpha as black). Rounding lives in CSS at the call sites — sidebar.tsx
    uses rounded-xl / rounded-lg.
  -->
  <defs>
    <!-- Ground. Measured corners land on Tailwind cyan-950 → cyan-500, with cyan-700
         (the mobile splash colour) sitting on the mid stop; a plain 2-stop ramp misses
         red by ~6/255 because the middle of the ramp is warmer than a straight lerp. -->
    <linearGradient id="ground" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="0.53" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Halo. Not a blur of the stars (that would be arm-shaped): fitting the PNG's
         residual against this ground shows a plain radial falloff around (500,300),
         RMS 2.2/255 over the rings. Stops are those ring means, decimated. -->
    <radialGradient id="halo" cx="500" cy="300" r="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6be2ee" stop-opacity="0.495"/>
      <stop offset="0.11" stop-color="#5fdcee" stop-opacity="0.464"/>
      <stop offset="0.23" stop-color="#4fdaee" stop-opacity="0.363"/>
      <stop offset="0.32" stop-color="#46d9ee" stop-opacity="0.282"/>
      <stop offset="0.41" stop-color="#42daed" stop-opacity="0.184"/>
      <stop offset="0.5" stop-color="#3cd9ee" stop-opacity="0.134"/>
      <stop offset="0.62" stop-color="#3bdaef" stop-opacity="0.074"/>
      <stop offset="0.74" stop-color="#44dcef" stop-opacity="0.049"/>
      <stop offset="0.86" stop-color="#40dff2" stop-opacity="0.033"/>
      <stop offset="1" stop-color="#63e7f3" stop-opacity="0"/>
    </radialGradient>

    <!-- The hero star is not flat white: it cools from white at the top tip to a pale
         cyan at the bottom one. objectBoundingBox units, so the ramp rides the <use>
         transform instead of being pinned to the canvas. -->
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cefafe"/>
    </linearGradient>

    <!-- Unit 4-point star, tips at radius 1. The taper is linear (straight edges, not a
         quadratic swoosh) and the shoulders sit at 0.1 — both read off the PNG. -->
    <path id="spark" d="M0 -1 L0.1 -0.1 L1 0 L0.1 0.1 L0 1 L-0.1 0.1 L-1 0 L-0.1 -0.1 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <use href="#spark" transform="translate(511.5 511.5) scale(311)" fill="url(#hero)"/>
  <use href="#spark" transform="translate(760 369) scale(117)" fill="#d0f2f8"/>
  <use href="#spark" transform="translate(300 756) scale(65)" fill="#b6e1e9"/>
</svg>
