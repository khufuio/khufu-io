name: OIDC probe (temporary)

# TEMPORARY — removed in the next commit. Prints the claims (never the token)
# of the OIDC token a deployment_status run gets, and tries the keyless
# exchange the indexing job relies on, to see whether the WIF binding admits it.
on:
  deployment_status:

jobs:
  probe:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OIDC claims (payload only)
        run: |
          set -euo pipefail
          echo "GITHUB_REF='${GITHUB_REF}' GITHUB_SHA=${GITHUB_SHA} env=${{ github.event.deployment.environment }} deployment.ref=${{ github.event.deployment.ref }}"
          token=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/projects/357646499338/locations/global/workloadIdentityPools/github/providers/github" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq 'del(.jti)'

      - name: Try the keyless exchange
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/357646499338/locations/global/workloadIdentityPools/github/providers/github
          service_account: gsc-indexing@khufu-496021.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false
